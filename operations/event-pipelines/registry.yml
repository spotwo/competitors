version: 1

pipelines:
  - id: inventory-position-projection
    enabled: true

    runtime:
      database_url_env: KERNEL_LAB_DATABASE_URL
      nats_url_env: KERNEL_LAB_NATS_URL
      watchdog_state_path_env: KERNEL_LAB_CANARY_WATCHDOG_STATE_PATH

    transport:
      stream: WMS_EVENTS
      subject_prefix: spotwo.wms.events

    consumer:
      durable: POSITION_PROJECTOR
      inbox_consumer_name: position_projection
      malformed_lookback_seconds: 300
      projection_gap_monitor: inventory_position
      handler_module: position_projection
      handler_class: InventoryPositionQuantityProjector

    canary:
      durable: EVENT_PIPELINE_CANARY
      consumer_name: event_pipeline_canary
      cadence_seconds: 60
      timeout_seconds: 30

    topology:
      stream:
        subjects:
          - spotwo.wms.events.>
        storage: file
        retention: limits
        replicas: 1
        duplicate_window_seconds: 120
      business_consumer:
        delivery_mode: pull
        deliver_policy: all
        ack_policy: explicit
        filter_subject: spotwo.wms.events.inventory.position.changed
        max_ack_pending: 10
        max_deliver: 3
      canary_consumer:
        delivery_mode: pull
        deliver_policy: all
        ack_policy: explicit
        filter_subject: spotwo.wms.events.health_check.ping
        max_ack_pending: 10
        max_deliver: 3

    slo:
      availability_target: 0.999
      latency_target_ratio: 0.99
      latency_target_seconds: 5
      stale_after_seconds: 180
      warning_consecutive_failures: 2
      critical_consecutive_failures: 3
      warning_slow_burn_rate: 3.0
      critical_fast_burn_rate: 14.4

    watchdog:
      start_grace_seconds: 30
      warning_missing_executions: 1
      critical_missing_executions: 2
      warning_scheduler_lag_seconds: 15
      critical_scheduler_lag_seconds: 60
      execution_timeout_seconds: 45

  - id: warehouse-work-state-projection
    # Enabled as desired state only after the Work State PostgreSQL/JetStream
    # integration proof; runtime readiness still fails closed without live signals.
    enabled: true

    runtime:
      database_url_env: KERNEL_LAB_DATABASE_URL
      nats_url_env: KERNEL_LAB_NATS_URL
      watchdog_state_path_env: KERNEL_LAB_WORK_CANARY_WATCHDOG_STATE_PATH

    transport:
      stream: WMS_EVENTS
      subject_prefix: spotwo.wms.events

    consumer:
      durable: WORK_STATE_PROJECTOR
      inbox_consumer_name: warehouse_work_state_projection
      malformed_lookback_seconds: 300
      # Strict ordering rejects gaps into the scoped consumer failure lane.
      # There is no Work State pending-gap buffer to inspect.
      projection_gap_monitor: none
      handler_module: work_state_projection
      handler_class: WarehouseWorkStateProjector

    canary:
      durable: WORK_EVENT_PIPELINE_CANARY
      consumer_name: warehouse_work_event_pipeline_canary
      cadence_seconds: 60
      timeout_seconds: 30

    topology:
      stream:
        subjects:
          - spotwo.wms.events.>
        storage: file
        retention: limits
        replicas: 1
        duplicate_window_seconds: 120
      business_consumer:
        delivery_mode: pull
        deliver_policy: all
        ack_policy: explicit
        filter_subject: spotwo.wms.events.warehouse.work.state.changed
        max_ack_pending: 10
        max_deliver: 3
      canary_consumer:
        delivery_mode: pull
        deliver_policy: all
        ack_policy: explicit
        filter_subject: spotwo.wms.events.health_check.ping
        max_ack_pending: 10
        max_deliver: 3

    slo:
      availability_target: 0.999
      latency_target_ratio: 0.99
      latency_target_seconds: 5
      stale_after_seconds: 180
      warning_consecutive_failures: 2
      critical_consecutive_failures: 3
      warning_slow_burn_rate: 3.0
      critical_fast_burn_rate: 14.4

    watchdog:
      start_grace_seconds: 30
      warning_missing_executions: 1
      critical_missing_executions: 2
      warning_scheduler_lag_seconds: 15
      critical_scheduler_lag_seconds: 60
      execution_timeout_seconds: 45

  - id: inventory-transaction-index
    # Third real domain pipeline; live readiness remains fail-closed.
    enabled: true

    runtime:
      database_url_env: KERNEL_LAB_DATABASE_URL
      nats_url_env: KERNEL_LAB_NATS_URL
      watchdog_state_path_env: KERNEL_LAB_INVENTORY_TRANSACTION_INDEX_CANARY_WATCHDOG_STATE_PATH

    transport:
      stream: WMS_EVENTS
      subject_prefix: spotwo.wms.events

    consumer:
      durable: INVENTORY_TRANSACTION_INDEX_PROJECTOR
      inbox_consumer_name: inventory_transaction_index
      malformed_lookback_seconds: 300
      # Immutable transaction posting uses no pending-version buffer.
      projection_gap_monitor: none
      handler_module: event_pipeline_handlers.inventory_transaction_index
      handler_class: InventoryTransactionIndexProjector

    canary:
      durable: INVENTORY_TRANSACTION_INDEX_CANARY
      consumer_name: inventory_transaction_index_canary
      cadence_seconds: 60
      timeout_seconds: 30

    topology:
      stream:
        subjects:
          - spotwo.wms.events.>
        storage: file
        retention: limits
        replicas: 1
        duplicate_window_seconds: 120
      business_consumer:
        delivery_mode: pull
        deliver_policy: all
        ack_policy: explicit
        filter_subject: spotwo.wms.events.inventory.transaction.posted
        max_ack_pending: 10
        max_deliver: 3
      canary_consumer:
        delivery_mode: pull
        deliver_policy: all
        ack_policy: explicit
        filter_subject: spotwo.wms.events.health_check.ping
        max_ack_pending: 10
        max_deliver: 3

    slo:
      availability_target: 0.999
      latency_target_ratio: 0.99
      latency_target_seconds: 5
      stale_after_seconds: 180
      warning_consecutive_failures: 2
      critical_consecutive_failures: 3
      warning_slow_burn_rate: 3.0
      critical_fast_burn_rate: 14.4

    watchdog:
      start_grace_seconds: 30
      warning_missing_executions: 1
      critical_missing_executions: 2
      warning_scheduler_lag_seconds: 15
      critical_scheduler_lag_seconds: 60
      execution_timeout_seconds: 45

# First isolated candidate: schema and rollout policy only. No provisioned
# durable, credentials, tenant writer or canary is implied by this declaration.
tenant_deployments:
  - id: transaction-index-pilot-a
    pipeline_id: inventory-transaction-index
    tenant_id: 00000000-0000-0000-0000-000000000001
    enabled: false
    business_durable: TENANT_TX_INDEX_PILOT_A
    inbox_consumer_name: tenant_transaction_index_pilot_a
    canary_durable: TENANT_TX_INDEX_CANARY_PILOT_A
    provisioner_nats_url_env: TENANT_PILOT_PROVISIONER_NATS_URL
    publisher_nats_url_env: TENANT_PILOT_PUBLISHER_NATS_URL
    consumer_nats_url_env: TENANT_PILOT_CONSUMER_NATS_URL
    canary_consumer_nats_url_env: TENANT_PILOT_CANARY_CONSUMER_NATS_URL
