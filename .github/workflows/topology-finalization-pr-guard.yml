name: Topology finalization cleanup guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: topology-finalization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup-guard:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 0

      - name: Detect deployment registry changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- operations/event-pipelines/registry.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r requirements.txt
        if: steps.scope.outputs.run == 'true'

      - name: Verify topology migration cleanup boundary
        if: steps.scope.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python scripts/check_topology_finalization_pr.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body-env PR_BODY \
            --pretty
