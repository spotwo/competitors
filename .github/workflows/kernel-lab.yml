name: PostgreSQL inventory kernel lab

on:
  pull_request:
    paths: &kernel_paths
      - 'kernel/**'
      - 'labs/postgres-inventory-kernel/**'
      - 'operations/event-pipelines/**'
      - 'schema/event-pipeline-deployment.schema.json'
      - 'scripts/validate_event_pipeline_deployments.py'
      - 'bin/check-kernel-lab'
      - 'bin/run-kernel-outbox-publisher'
      - 'bin/inspect-kernel-outbox'
      - 'bin/archive-kernel-outbox'
      - 'bin/bootstrap-kernel-position-projection'
      - 'bin/inspect-kernel-projection-gaps'
      - 'bin/rebuild-kernel-position-projection'
      - 'bin/run-kernel-position-projection-retries'
      - 'bin/replay-kernel-consumer-failure'
      - 'bin/inspect-kernel-consumer-failures'
      - 'bin/archive-kernel-consumer-failures'
      - 'bin/inspect-kernel-malformed-deliveries'
      - 'bin/archive-kernel-malformed-deliveries'
      - 'bin/inspect-kernel-nats-consumer'
      - 'bin/inspect-kernel-nats-stream'
      - 'bin/*kernel-event-pipeline*'
      - 'decisions/domain/**'
      - 'scenarios/**'
      - 'ontology/inventory.yml'
      - 'ontology/inventory-transaction.yml'
      - 'ontology/handling-unit.yml'
      - 'ontology/process.yml'
      - 'ontology/work.yml'
      - '.github/workflows/kernel-lab.yml'
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths: *kernel_paths
  workflow_dispatch:
    inputs:
      perf_profile:
        description: PostgreSQL performance profile
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - standard
          - scale

concurrency:
  group: kernel-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-kernel-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 2

      - name: Detect relevant merge-group changes
        id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "merge_group" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet HEAD^1 HEAD -- \
            kernel \
            labs/postgres-inventory-kernel \
            operations/event-pipelines \
            schema/event-pipeline-deployment.schema.json \
            scripts/validate_event_pipeline_deployments.py \
            bin/check-kernel-lab \
            bin/run-kernel-outbox-publisher \
            bin/inspect-kernel-outbox \
            bin/archive-kernel-outbox \
            bin/bootstrap-kernel-position-projection \
            bin/inspect-kernel-projection-gaps \
            bin/rebuild-kernel-position-projection \
            bin/run-kernel-position-projection-retries \
            bin/replay-kernel-consumer-failure \
            bin/inspect-kernel-consumer-failures \
            bin/archive-kernel-consumer-failures \
            bin/inspect-kernel-malformed-deliveries \
            bin/archive-kernel-malformed-deliveries \
            bin/inspect-kernel-nats-consumer \
            bin/inspect-kernel-nats-stream \
            bin/inspect-kernel-event-pipeline \
            bin/run-kernel-event-pipeline-canary \
            bin/run-kernel-event-pipeline-canary-consumer \
            bin/inspect-kernel-event-pipeline-sli \
            bin/run-kernel-event-pipeline-fault-drills \
            bin/inspect-kernel-event-pipeline-readiness \
            bin/inspect-kernel-event-pipeline-topology \
            bin/plan-kernel-event-pipeline-topology \
            bin/apply-kernel-event-pipeline-topology \
            bin/inspect-kernel-event-pipeline-topology-provisioning \
            bin/run-kernel-event-pipeline-topology-reconciler \
            bin/inspect-kernel-event-pipeline-topology-interventions \
            bin/resolve-kernel-event-pipeline-topology-intervention \
            decisions/domain \
            scenarios \
            ontology/inventory.yml \
            ontology/inventory-transaction.yml \
            ontology/handling-unit.yml \
            ontology/process.yml \
            ontology/work.yml \
            .github/workflows/kernel-lab.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: labs/postgres-inventory-kernel/requirements.txt

      - name: Run PostgreSQL inventory kernel lab
        if: steps.scope.outputs.run == 'true'
        env:
          KERNEL_LAB_PERF_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.perf_profile || 'smoke' }}
        run: bash bin/check-kernel-lab
