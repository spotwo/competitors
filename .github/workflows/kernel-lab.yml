name: PostgreSQL inventory kernel lab

on:
  pull_request:
    paths:
      - 'labs/postgres-inventory-kernel/**'
      - 'bin/check-kernel-lab'
      - 'decisions/domain/0014-inventory-key-stock-dimensions.md'
      - 'ontology/inventory-transaction.yml'
      - 'ontology/handling-unit.yml'
      - '.github/workflows/kernel-lab.yml'
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - 'labs/postgres-inventory-kernel/**'
      - 'bin/check-kernel-lab'
      - 'decisions/domain/0014-inventory-key-stock-dimensions.md'
      - 'ontology/inventory-transaction.yml'
      - 'ontology/handling-unit.yml'
      - '.github/workflows/kernel-lab.yml'
  workflow_dispatch:

concurrency:
  group: kernel-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-kernel-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: labs/postgres-inventory-kernel/requirements.txt
      - run: bash bin/check-kernel-lab
