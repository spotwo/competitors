name: PostgreSQL inventory kernel lab

on:
  pull_request:
    paths:
      - 'labs/postgres-inventory-kernel/**'
      - 'bin/check-kernel-lab'
      - 'decisions/domain/0014-inventory-key-stock-dimensions.md'
      - 'decisions/domain/0015-inventory-commitment-engine.md'
      - 'decisions/domain/0016-inventory-holds-eligibility.md'
      - 'decisions/domain/0017-warehouse-work-execution-engine.md'
      - 'decisions/domain/0018-golden-warehouse-scenarios.md'
      - 'decisions/domain/0019-postgresql-performance-contention-lab.md'
      - 'scenarios/**'
      - 'ontology/inventory.yml'
      - 'ontology/inventory-transaction.yml'
      - 'ontology/handling-unit.yml'
      - 'ontology/process.yml'
      - 'ontology/work.yml'
      - '.github/workflows/kernel-lab.yml'
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - 'labs/postgres-inventory-kernel/**'
      - 'bin/check-kernel-lab'
      - 'decisions/domain/0014-inventory-key-stock-dimensions.md'
      - 'decisions/domain/0015-inventory-commitment-engine.md'
      - 'decisions/domain/0016-inventory-holds-eligibility.md'
      - 'decisions/domain/0017-warehouse-work-execution-engine.md'
      - 'decisions/domain/0018-golden-warehouse-scenarios.md'
      - 'decisions/domain/0019-postgresql-performance-contention-lab.md'
      - 'scenarios/**'
      - 'ontology/inventory.yml'
      - 'ontology/inventory-transaction.yml'
      - 'ontology/handling-unit.yml'
      - 'ontology/process.yml'
      - 'ontology/work.yml'
      - '.github/workflows/kernel-lab.yml'
  workflow_dispatch:
    inputs:
      perf_profile:
        description: PostgreSQL performance profile
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - standard
          - scale

concurrency:
  group: kernel-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-kernel-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 2

      - name: Detect relevant merge-group changes
        id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "merge_group" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet HEAD^1 HEAD -- \
            labs/postgres-inventory-kernel \
            bin/check-kernel-lab \
            decisions/domain/0014-inventory-key-stock-dimensions.md \
            decisions/domain/0015-inventory-commitment-engine.md \
            decisions/domain/0016-inventory-holds-eligibility.md \
            decisions/domain/0017-warehouse-work-execution-engine.md \
            decisions/domain/0018-golden-warehouse-scenarios.md \
            decisions/domain/0019-postgresql-performance-contention-lab.md \
            scenarios \
            ontology/inventory.yml \
            ontology/inventory-transaction.yml \
            ontology/handling-unit.yml \
            ontology/process.yml \
            ontology/work.yml \
            .github/workflows/kernel-lab.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: labs/postgres-inventory-kernel/requirements.txt

      - name: Run PostgreSQL inventory kernel lab
        if: steps.scope.outputs.run == 'true'
        env:
          KERNEL_LAB_PERF_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.perf_profile || 'smoke' }}
        run: bash bin/check-kernel-lab
