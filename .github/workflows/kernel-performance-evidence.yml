name: PostgreSQL kernel performance evidence

on:
  workflow_dispatch:

concurrency:
  group: kernel-perf-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, scale]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: benchmark-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: labs/postgres-inventory-kernel/requirements.txt
      - name: Run ${{ matrix.profile }} PostgreSQL kernel benchmark
        env:
          KERNEL_LAB_PERF_PROFILE: ${{ matrix.profile }}
        run: bash bin/check-kernel-lab
