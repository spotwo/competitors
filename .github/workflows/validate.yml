name: Validate knowledge base

on:
  pull_request:
    paths:
      - 'companies/**'
      - 'evidence/**'
      - 'terminology/**'
      - 'authorities/**'
      - 'claims/**'
      - 'taxonomy/**'
      - 'ontology/**'
      - 'kpis/**'
      - 'integrations/**'
      - 'capabilities/**'
      - 'workflows/**'
      - 'ledger/**'
      - 'events/**'
      - 'schema/**'
      - 'scripts/**'
      - 'bin/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'companies/**'
      - 'evidence/**'
      - 'terminology/**'
      - 'authorities/**'
      - 'claims/**'
      - 'taxonomy/**'
      - 'ontology/**'
      - 'kpis/**'
      - 'integrations/**'
      - 'capabilities/**'
      - 'workflows/**'
      - 'ledger/**'
      - 'events/**'
      - 'schema/**'
      - 'scripts/**'
      - 'bin/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

concurrency:
  group: competitors-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: bash bin/check
