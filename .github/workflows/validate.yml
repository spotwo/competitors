name: Validate knowledge base

# ASDLC levels for this repository:
# - pull_request: fast independent verification of the pushed checkpoint
# - merge_group: full pre-merge validation of the exact merge candidate
# - push to main: post-merge integrity safety net, never a substitute for the merge gate
on:
  pull_request:
    paths:
      - 'companies/**'
      - 'evidence/**'
      - 'terminology/**'
      - 'authorities/**'
      - 'claims/**'
      - 'taxonomy/**'
      - 'ontology/**'
      - 'kpis/**'
      - 'integrations/**'
      - 'capabilities/**'
      - 'workflows/**'
      - 'ledger/**'
      - 'events/**'
      - 'scenarios/**'
      - 'kernel/**'
      - 'decisions/**'
      - 'schema/**'
      - 'scripts/**'
      - 'bin/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - 'companies/**'
      - 'evidence/**'
      - 'terminology/**'
      - 'authorities/**'
      - 'claims/**'
      - 'taxonomy/**'
      - 'ontology/**'
      - 'kpis/**'
      - 'integrations/**'
      - 'capabilities/**'
      - 'workflows/**'
      - 'ledger/**'
      - 'events/**'
      - 'scenarios/**'
      - 'kernel/**'
      - 'decisions/**'
      - 'schema/**'
      - 'scripts/**'
      - 'bin/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

concurrency:
  group: competitors-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: bash bin/check
