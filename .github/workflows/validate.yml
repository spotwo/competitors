name: Validate knowledge base

# ASDLC levels for this repository:
# - pull_request: fast independent verification of the pushed checkpoint
# - merge_group: full pre-merge validation of the exact merge candidate
# - push to main: post-merge integrity safety net, never a substitute for the merge gate
on:
  pull_request:
    paths:
      - 'companies/**'
      - 'evidence/**'
      - 'terminology/**'
      - 'authorities/**'
      - 'claims/**'
      - 'taxonomy/**'
      - 'ontology/**'
      - 'kpis/**'
      - 'integrations/**'
      - 'capabilities/**'
      - 'workflows/**'
      - 'ledger/**'
      - 'events/**'
      - 'schema/**'
      - 'scripts/**'
      - 'bin/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - 'companies/**'
      - 'evidence/**'
      - 'terminology/**'
      - 'authorities/**'
      - 'claims/**'
      - 'taxonomy/**'
      - 'ontology/**'
      - 'kpis/**'
      - 'integrations/**'
      - 'capabilities/**'
      - 'workflows/**'
      - 'ledger/**'
      - 'events/**'
      - 'schema/**'
      - 'scripts/**'
      - 'bin/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

concurrency:
  group: competitors-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: bash bin/check
