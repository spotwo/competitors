name: Validate knowledge base

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python scripts/generate_matrices.py --check
      - run: python scripts/generate_audit.py --check
      - run: python scripts/generate_domain_views.py --check
