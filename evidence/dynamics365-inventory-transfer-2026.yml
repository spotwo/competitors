captured_at: '2026-08-18'
supports:
  - Dynamics 365 distinguishes inventory movements from inventory transfers.
  - Transfer journals can perform immediate inventory transfer between inventory dimensions without tracking in-transit inventory.
  - Transfer orders track in-transit inventory and use picking shipping receiving and putaway processes between physical locations.
  - An inter-warehouse transfer can therefore span multiple warehouse process boundaries rather than being one atomic location movement.
