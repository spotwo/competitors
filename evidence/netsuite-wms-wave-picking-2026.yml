supports:
  - NetSuite WMS waves generate pick tasks and support Pending Release and Released states.
  - Picking types include Single Order and Bulk Picking or Multiple Order.
  - Pick tasks can be assigned to operators before release, while unassigned work can be claimed by the operator processing it in the mobile app.
  - Released waves sort pick tasks and determine recommended bins where bin management is enabled.
