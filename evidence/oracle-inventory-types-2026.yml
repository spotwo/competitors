supports:
  - Oracle distinguishes allocatable available inventory from unallocatable unavailable inventory.
  - Allocated inventory is unavailable for new allocation even though it remains physically present.
  - Receipt state VAS drop zones outbound containers and lock codes can make inventory unavailable.
