supports:
  - Odoo cluster picking combines multi-order picking with immediate sorting into order-specific packages during the pick.
  - Products are grouped by location and operators can confirm source location, product and destination package through Barcode.
  - Cluster picking removes a separate post-pick sorting step by maintaining order separation in containers during execution.
