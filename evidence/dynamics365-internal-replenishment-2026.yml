captured_at: '2026-08-18'
supports:
  - Dynamics 365 supports wave-demand, min/max, load-demand and immediate replenishment strategies for warehouse-managed locations.
  - Replenishment templates determine items, quantities and target locations while location directives determine target and source inventory locations.
  - Work templates create replenishment work, typically with Pick and Put work lines.
  - Demand replenishment can be linked to outbound, production, transfer-order and kanban demand.
