supports:
  - The 2023 CTO article says the original MVP used MySQL on Google Cloud SQL before migration to Cloud Spanner.
  - Describes Golang integration with Spanner and a pipeline normalizing WMS, robotics, and payroll feeds to shift-linked transactions.
  - Historically reports a five-minute ingestion interval, a 4.5 TB database, 20-30 writes per second, 30-50 reads per second and average reads under 5 ms.
notes: Historical 2023 technical snapshot; do not treat traffic, ingest interval, stack, or performance as independently verified 2026 current state.
