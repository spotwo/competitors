supports:
  - SAP EWM physical inventory uses physical inventory documents and count documents before count execution.
  - Workers enter count results and can perform recounts when required.
  - Physical inventory documents are posted in EWM after counting.
  - Inventory differences can be analyzed separately and posted through the Difference Analyzer.
