  - Oracle WMS sends operational instructions to floor users through Tasks, including Picking tasks.
  - Tasks expose priority, status, current location, next location, destination zone, assignment, hold, release and cancel controls.
  - RF Execute Task presents available work in priority order and supports explicit user assignment or an unassigned task pool.
