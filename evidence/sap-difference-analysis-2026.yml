supports:
  - SAP EWM separates physical or operational quantity differences from the act of posting them to ERP and financial inventory records.
  - Difference Analyzer supports review of differences before posting.
  - Difference reasons and priorities are explicit configuration concepts.
  - Posting differences reconciles EWM stock with ERP and creates the corresponding material movement in ERP.
