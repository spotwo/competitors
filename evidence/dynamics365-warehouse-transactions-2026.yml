captured_at: '2026-08-18'
supports:
  - Warehouse transactions are database records describing how inventory is stored and moved around a warehouse.
  - Current Dynamics warehouse transaction types include registered issue, registered receipt, physical reservation and removed physical reservation.
  - The Warehouse transactions inquiry combines relevant warehouse and standard inventory transactions for warehouse operations.
  - Microsoft documents that warehouse on-hand inventory remains coupled to inventory transaction and warehouse reserve tables.
