supports:
  - Dynamics 365 distinguishes physical inventory, physically reserved quantity, available physical quantity, ordered inventory, ordered reservations, and total available quantity.
  - Available physical is calculated as physical inventory minus physical reserved quantity.
  - Available for reservation may include or exclude expected receipts depending on inventory reservation policy.
