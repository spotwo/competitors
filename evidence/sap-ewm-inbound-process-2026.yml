  - The inbound process distinguishes truck arrival, readiness for warehouse processing, unloading, goods receipt and putaway task creation.
  - Handling units can be unloaded by RF or application workflows.
  - Goods receipt updates inbound delivery and transportation status before putaway tasks are created.
