services:
  db:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    command: ["postgres", "-c", "max_connections=160"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kernel_lab
    ports:
      - "${KERNEL_LAB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kernel_lab"]
      interval: 1s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.14.5@sha256:026a66a4497c6d7d3eed741781770099c48c755bf3a55b6950d76dd210596eb3
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "${KERNEL_LAB_NATS_PORT:-54222}:4222"
    volumes:
      - nats-data:/data

volumes:
  nats-data:
