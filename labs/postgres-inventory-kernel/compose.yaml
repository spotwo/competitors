services:
  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kernel_lab
    ports:
      - "${KERNEL_LAB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kernel_lab"]
      interval: 1s
      timeout: 3s
      retries: 30
