id: cross-docking
group: inbound
label: Cross-docking
status: adopted
definition: Match eligible inbound supply to outbound demand and route the matched quantity directly or near-directly into outbound fulfilment with minimal or no normal storage dwell.
purpose: Reduce storage touches, inventory dwell time, and later picking for demand that can be satisfied at receipt.
inputs: [receipt, inbound-inventory, outbound-demand, cross-dock-policy]
outputs: [cross-dock-allocation, cross-dock-work, outbound-ready-inventory, residual-putaway-demand]
entities: [receipt, handling-unit, order, allocation, shipment, staging-location, cross-dock-work]
strategies: [planned-cross-dock, lpn-match, sku-match, attribute-match, flow-through]
related_capabilities: [receiving, allocation, putaway, staging, loading, shipping]
