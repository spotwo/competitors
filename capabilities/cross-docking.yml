spotwo:
  canonical_term: Cross-docking
  status: adopted
  notes: Cross-docking is a demand-linked allocation and routing decision, not merely a special storage location. Matched quantity bypasses normal putaway and later picking; residual quantity follows normal inbound handling.
research_gaps:
