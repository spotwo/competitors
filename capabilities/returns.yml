id: returns
group: reverse
label: Returns
status: adopted
definition: Receive identify inspect disposition and route inventory returned from customers or downstream locations while keeping physical warehouse outcome separate from commercial credit or replacement logic.
purpose: Bring reverse-flow goods back under controlled inventory and determine their next valid operational state.
inputs: [return-reference, returned-goods, reason-code, return-policy]
outputs: [return-receipt, disposition, inventory-condition, return-work, commercial-outcome-signal]
entities: [return, return-reference, inventory, sku, lot, serial, handling-unit, reason-code, disposition]
strategies: [authorized-return, blind-return, restock, quarantine, refurbish, return-to-vendor, scrap]
related_capabilities: [receiving, inspection, putaway]
