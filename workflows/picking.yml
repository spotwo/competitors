spotwo:
  status: candidate
  canonical_spine: [demand-ready, release, work-creation, assignment, routing, execution, exception-resolution, handoff]
  canonical_objects: [fulfillment-demand, allocation, wave, pick-work-group, pick-task, assignment, worker-resource, equipment-resource, pick-route, handling-unit, source-location, destination-location, pick-confirmation, pick-exception]
  task_states: [planned, released, assigned, in-progress, held, exception, completed, cancelled]
  commands: [release-pick-work, assign-pick-work, start-pick-task, confirm-pick, report-short-pick, report-damage, hold-pick-work, resume-pick-work, cancel-pick-work, complete-pick-work]
  events: [pick-work-released, pick-work-assigned, pick-task-started, pick-confirmed, pick-short-reported, pick-damage-reported, pick-work-held, pick-work-resumed, pick-work-cancelled, pick-work-completed]
  notes: Keep Wave optional. Pick Work Group and Pick Task are canonical abstractions; vendor terms such as Warehouse Order, Work, Assignment and Pick List remain integration mappings. Execution channel must not be encoded into the business capability or task type.
research_gaps:
  - Sample at least ten more WMS products before adopting the Spotwo task state model.
  - Separate inventory allocation from pick-source selection where vendors model them independently.
  - Determine whether zone handoff should create a new Pick Work Group or preserve one group across zones.
  - Compare short-pick residual-demand and automatic reallocation behavior across SAP, Manhattan, Blue Yonder, Oracle, Infor and Mecalux.
  - Add UI interaction observations for handheld RF, voice, pick-to-light and goods-to-person stations without treating presentation details as domain semantics.
