id: inventory
title: Inventory Ontology
kind: inventory
status: candidate
description: Core inventory concepts independent of a specific WMS implementation. Physical quantity, commitments, allocation, operational condition and availability are modeled as separate concerns rather than one overloaded inventory-status enum.
entities:
  - id: item
    term: Item
    definition: A master-data record for a thing that can be stocked, handled or transacted.
    aliases: [SKU, product]
    attributes: [item_code, description, base_uom]
  - id: stock
    term: Stock
    definition: A quantity of an item held under a specific set of inventory dimensions such as location, owner, condition, lot or serial.
  - id: physical-quantity
    term: Physical Quantity
    definition: Quantity physically recorded in the warehouse regardless of whether it is currently allocatable.
    aliases: [on-hand quantity, current quantity]
  - id: reserved-quantity
    term: Reserved Quantity
    definition: Quantity committed to demand through reservation semantics, potentially at a coarser inventory scope than the final execution source.
  - id: allocated-quantity
    term: Allocated Quantity
    definition: Portion of inventory bound to demand at an execution-relevant source specificity.
  - id: available-quantity
    term: Available Quantity
    definition: Derived quantity currently eligible for a defined action such as reservation, allocation or picking under active inventory rules.
    aliases: [allocatable quantity]
  - id: availability-view
    term: Availability View
    definition: A calculated projection of inventory eligibility for a specific action, scope and set of rules rather than an independently mutable stock record.
  - id: reservation
    term: Reservation
    definition: Candidate Spotwo concept for an inventory commitment to demand that may defer exact location, LPN or other source binding until warehouse execution.
  - id: allocation
    term: Allocation
    definition: Candidate Spotwo concept binding demand to specific inventory or a sufficiently specific source decision for warehouse execution.
  - id: inventory-condition
    term: Inventory Condition
    definition: Business or quality condition attached to stock such as normal damaged quarantine or inspection status.
    examples: [normal, damaged, quarantine, inspection]
  - id: allocation-eligibility
    term: Allocation Eligibility
    definition: Whether inventory may participate in new allocation independent of its physical presence.
    examples: [allocatable, unallocatable]
  - id: inventory-hold
    term: Inventory Hold
    definition: Operational restriction that prevents one or more inventory actions without implying that the inventory is physically absent.
    aliases: [lock, lock code]
  - id: lot
    term: Lot
    definition: A batch identity shared by a quantity of otherwise equivalent item units.
    aliases: [batch]
    attributes: [lot_number, manufacture_date, expiry_date]
  - id: serial
    term: Serial Number
    definition: An identifier assigned to an individual serialized item unit.
    attributes: [serial_number]
  - id: owner
    term: Inventory Owner
    definition: The party that owns or is entitled to dispose of stock.
  - id: uom
    term: Unit of Measure
    definition: The unit in which item quantity is expressed or handled.
    aliases: [UOM]
    examples: [each, case, pack, pallet]
relationships:
  - {subject: stock, predicate: references, object: item}
  - {subject: stock, predicate: has, object: physical-quantity}
  - {subject: stock, predicate: may-have, object: reserved-quantity}
  - {subject: stock, predicate: may-have, object: allocated-quantity}
  - {subject: stock, predicate: derives, object: available-quantity}
  - {subject: availability-view, predicate: derives-from, object: stock}
  - {subject: reservation, predicate: commits, object: stock}
  - {subject: allocation, predicate: binds, object: stock}
  - {subject: stock, predicate: has, object: inventory-condition}
  - {subject: stock, predicate: has, object: allocation-eligibility}
  - {subject: stock, predicate: may-have, object: inventory-hold}
  - {subject: stock, predicate: may-reference, object: lot}
  - {subject: stock, predicate: may-reference, object: serial}
  - {subject: stock, predicate: may-have, object: owner}
  - {subject: stock, predicate: measured-in, object: uom}
research_gaps:
  - Compare exact available-to-reserve, available-to-allocate and available-to-pick calculations across SAP Oracle Manhattan Blue Yonder Infor and 3PL WMS products.
  - Validate whether Reservation and Allocation should be separate persisted Spotwo aggregates or one commitment aggregate with changing specificity.
  - Define concurrency and idempotency invariants for competing inventory commitments.
  - Define 3PL ownership and hold semantics where owner client facility and regulatory restrictions overlap.
last_verified: '2026-08-18'
evidence_refs: [oracle-wms-lpn-uom-2026, oracle-inventory-types-2026, infor-cycle-counting-2026, dynamics365-reservations-2026, dynamics365-onhand-availability-2026, oracle-allocation-model-2026]
