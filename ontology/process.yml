id: process
title: Warehouse Process Ontology
kind: process
status: candidate
description: Canonical warehouse and intralogistics process vocabulary spanning inbound, storage, fulfillment, outbound and reverse flows.
entities:
  - id: receiving
    term: Receiving
    definition: Accepting inbound goods and recording their arrival under warehouse control.
  - id: inspection
    term: Inspection
    definition: Checking inbound or stored goods for quality, quantity, compliance or damage.
  - id: putaway
    term: Putaway
    definition: Moving received inventory to a selected storage location under putaway policy.
  - id: replenishment
    term: Internal Replenishment
    definition: Moving stock from reserve or upstream storage into a location that supplies picking or production execution.
  - id: relocation
    term: Relocation
    definition: Moving inventory between internal warehouse locations for storage correction balancing consolidation or operational reorganization.
  - id: inventory-transfer
    term: Inventory Transfer
    definition: Business process for moving inventory across warehouse or organizational contexts; it may be immediate or may orchestrate picking shipping in-transit receipt and putaway.
  - id: cycle-counting
    term: Cycle Counting
    definition: Counting selected inventory without requiring a full physical inventory event.
  - id: allocation
    term: Allocation
    definition: Binding eligible demand to an execution-relevant inventory source while keeping coarser reservation semantics separate where needed.
  - id: picking
    term: Picking
    definition: Retrieving stock from storage to satisfy an order, production or transfer requirement.
  - id: consolidation
    term: Consolidation
    definition: Combining picked units or containers for a common downstream order or shipment.
  - id: packing
    term: Packing
    definition: Preparing picked goods into shipping or handling units.
  - id: sortation
    term: Sortation
    definition: Routing units into destinations or sequences based on operational criteria.
  - id: staging
    term: Staging
    definition: Temporarily positioning goods or handling units before the next process such as loading.
  - id: loading
    term: Loading
    definition: Moving staged goods or handling units onto a transport vehicle or carrier asset.
  - id: shipping
    term: Shipping
    definition: Confirming and dispatching outbound goods from the warehouse.
  - id: cross-docking
    term: Cross-docking
    definition: Matching inbound supply to outbound demand and routing matched inventory toward outbound flow with minimal or no normal storage dwell.
  - id: returns
    term: Returns
    definition: Receiving and dispositioning goods returned from customers or downstream locations.
  - id: warehouse-task
    term: Warehouse Task
    definition: An executable unit of warehouse work that directs a movement or operation.
    vendor_specific: false
relationships:
  - {subject: receiving, predicate: typically-precedes, object: putaway}
  - {subject: replenishment, predicate: supplies, object: picking}
  - {subject: picking, predicate: typically-precedes, object: consolidation}
  - {subject: consolidation, predicate: typically-precedes, object: packing}
  - {subject: packing, predicate: typically-precedes, object: staging}
  - {subject: staging, predicate: typically-precedes, object: loading}
  - {subject: loading, predicate: typically-precedes, object: shipping}
  - {subject: warehouse-task, predicate: may-execute, object: relocation}
  - {subject: inventory-transfer, predicate: may-orchestrate, object: picking}
  - {subject: inventory-transfer, predicate: may-orchestrate, object: shipping}
  - {subject: inventory-transfer, predicate: may-orchestrate, object: receiving}
  - {subject: inventory-transfer, predicate: may-orchestrate, object: putaway}
research_gaps:
  - Map process vocabulary against VDI 3601 task and performance areas and at least ten WMS navigation models.
  - Separate business process executable Warehouse Work inventory movement and automation command vocabularies in the next ontology revision.
  - Validate inter-warehouse transfer orchestration across SAP Oracle Infor and ERP-centric systems.
