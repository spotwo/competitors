stable_boundaries:
  - InventoryPosition != InventoryTransaction
  - InventoryKey != SerialMembership
  - InventoryAnchor = Location XOR direct HandlingUnit
  - Availability != Reservation != Allocation != Assignment
  - Reservation and Allocation use consumed quantity after accepted execution
  - InventoryCondition != InventoryHold != HoldPolicy != ActionEligibility
  - BusinessProcess != WarehouseWork != WarehouseTask
  - Allocation != WorkAssignment
  - TaskExecution != TaskConfirmation
  - TaskConfirmation != InventoryTransaction
  - TaskException != InventoryHold
  - MovementIntent != InventoryMovement
  - InventoryTransaction != DomainEvent != EPCISEvent
  - CountResult does not mutate stock before explicit reconciliation

executable_contract:
  postgres_lab: labs/postgres-inventory-kernel
  migrations:
    - labs/postgres-inventory-kernel/sql/001_schema.sql
    - labs/postgres-inventory-kernel/sql/002_function_search_path.sql
    - labs/postgres-inventory-kernel/sql/003_idempotency_fingerprint.sql
    - labs/postgres-inventory-kernel/sql/004_commitment_engine.sql
    - labs/postgres-inventory-kernel/sql/005_holds_eligibility.sql
    - labs/postgres-inventory-kernel/sql/006_warehouse_work_engine.sql
    - labs/postgres-inventory-kernel/sql/007_golden_scenario_support.sql
  minimum_functional_tests: 43
  validation_commands:
